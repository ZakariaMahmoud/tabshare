<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tabshare</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/admin.js"></script>
</head>
<body>
<main>
  <h1>tabshare</h1>
  <p class="sub" id="status">Connecting…</p>

  <section class="panel">
    <div class="row spread"><h2>1. Pick a tab</h2><button id="refresh">Refresh</button></div>
    <ul class="tabs" id="tabs"></ul>
  </section>

  <section class="panel">
    <h2>2. Share options</h2>
    <div class="options">
      <div class="row">
        <label>Mode
          <select id="mode">
            <option value="isolated">Isolated copy (recommended)</option>
            <option value="mirror">Mirror my real tab</option>
          </select>
        </label>
        <label>Quality
          <select id="quality">
            <option value="standard" selected>Standard</option>
            <option value="high">High — sharpest text, more bandwidth</option>
            <option value="low">Low — for slow connections</option>
          </select>
        </label>
      </div>
      <p class="muted" id="mode-help"></p>

      <div id="cookie-section">
        <label><input type="checkbox" id="include-cookies"> Include my cookies (stay logged in)</label>
        <div id="cookie-picker" class="hidden">
          <p class="muted">Only cookies for the domains you tick are copied into the isolated browser on <em>this</em> machine. The viewer receives video frames only — never cookie values.</p>
          <div class="domains" id="domains"></div>
        </div>
      </div>

      <label><input type="checkbox" id="allow-control"> Let the viewer control the page (mouse &amp; keyboard)</label>
      <label><input type="checkbox" id="one-time"> One-time link (only the first viewer can join)</label>
      <div class="row">
        <span>Expires</span>
        <label><input type="radio" name="expiry" value="after" checked> after <input type="number" id="ttl" min="1" value="30">
          <select id="ttl-unit"><option value="1" selected>minutes</option><option value="60">hours</option><option value="1440">days</option></select></label>
        <label><input type="radio" name="expiry" value="at"> at <input type="datetime-local" id="expires-at"></label>
      </div>
      <div class="row">
        <label>Max viewers at once <input type="number" id="max-viewers" min="1" max="10" value="1"></label>
        <span class="muted" id="viewers-help"></span>
      </div>
      <div class="warn hidden" id="risk"></div>
      <div class="row"><button class="primary" id="create" disabled>Create share link</button><span class="error" id="create-error"></span></div>
    </div>
  </section>

  <section class="panel">
    <h2>Active shares</h2>
    <div id="shares"></div>
    <p class="muted" id="no-shares">No active shares.</p>
    <p class="error" id="shares-error"></p>
  </section>
</main>
</body>
</html>
